name: Build and deploy website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'install.md'
      - 'theme.md'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare guides from repository documentation
        run: python3 site/scripts/sync-guides.py
      - uses: actions/jekyll-build-pages@v1
        with:
          source: site
          destination: ./_site
      - uses: actions/upload-pages-artifact@v4
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
