<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/images/logo-readme.png' | relative_url }}" alt="TreeFrogUI"></a>
        <nav aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/guides/' | relative_url }}">Guides</a>
          <a href="{{ '/guides/ports/' | relative_url }}">Ports</a>
          <a href="{{ '/news/' | relative_url }}">News</a>
          <a href="https://github.com/tzubertowski/TreeFrogUI">GitHub ↗</a>
        </nav>
      </header>
      <main>
        {% if page.collection == "posts" %}
        <article class="post-content markdown-body">
          <header class="post-heading"><p class="eyebrow">News &amp; notes</p><h1>{{ page.title | escape }}</h1><time>{{ page.date | date: "%b %-d, %Y" }}</time></header>
          {{ content }}
        </article>
        {% else %}
        {{ content }}
        {% endif %}
      </main>
      <footer><a href="https://github.com/tzubertowski/TreeFrogUI">TreeFrogUI on GitHub</a></footer>
    </div>
  </body>
</html>
